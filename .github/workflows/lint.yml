name: Lint and test

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting (fix with `npm run format`)
        run: npm run format:check

      # next.config.ts refuses to load without the Sourcify server URLs
      - run: npm run lint
        env:
          SOURCIFY_SERVER_URL: https://sourcify.dev/server
          SOURCIFY_SERVER_INTERNAL_URL: https://sourcify.dev/server

      - run: npm test
